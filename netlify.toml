# ============================================================
# 控制理论模拟器 V5.0 · Netlify 配置（前后端分离）
# ------------------------------------------------------------
#   public/                前端静态站 —— publish 目录
#                          index.html + styles.css + js/ + vendor/ + assets/ + docs/
#                          零构建、零依赖，可双击 public/index.html 离线运行
#   netlify/functions/     后端 —— Netlify Functions 2.0
#                          Netlify 默认扫描目录，无需在 UI 里再指定
#                          路由由函数内 export const config = { path } 声明
#   tools/                 本地预览与开发脚本（不参与发布）
#
# 注意：Functions 2.0 的 config.path 已直接提供路由。
#       不要再写 [[redirects]] /api/* → /.netlify/functions/:splat，
#       否则请求会被重写到函数并未注册的默认路径，反而 404。
# ============================================================

[build]
  publish   = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── 全站安全头（静态缓存策略见 public/_headers） ──────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# ── 函数响应禁止 CDN 缓存 ─────────────────────────────────
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
